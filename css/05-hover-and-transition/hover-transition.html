<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover</title>
  <style>
    button { padding: 12px 24px; border: 0; background: green; color: white; transition: all 0.3s; }
    button:hover { background: darkgreen; transform: scale(1.1); }
  </style>
</head>
<body>
  <button>Mujhe hover karo</button>
</body>
</html>
