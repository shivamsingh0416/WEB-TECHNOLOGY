<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Border Radius</title>
  <style>
    .box { width: 150px; height: 150px; background: tomato; border-radius: 20px; }
    .circle { width: 150px; height: 150px; background: royalblue; border-radius: 50%; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="box"></div>
  <div class="circle"></div>
</body>
</html>
